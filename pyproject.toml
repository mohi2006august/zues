[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panchayatcast"
version = "0.1.0"
description = "Block-to-Panchayat weather forecast downscaling for agromet advisories (SIH 26074)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  # cftime 1.6.6's Linux wheels (abi3, Cython 3.3 limited API for 3.11) register the same
  # shared Cython type as uharfbuzz's (built for 3.10) with a different size, so the two
  # cannot be imported together ("Shared Cython type ... has the wrong size").
  "cftime>=1.6,<1.6.6",
  "shapely>=2.0",
  "geopandas>=1.0",
  "pyogrio>=0.7",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "matplotlib>=3.8",
  "fpdf2>=2.7",
  "pyarrow>=15",
  "requests>=2.31",
  "uharfbuzz>=0.39",
]

[project.optional-dependencies]
data = ["cdsapi>=0.7", "imdlib>=0.1.19"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
pcast = "panchayatcast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panchayatcast = ["assets/fonts/*.ttf", "assets/fonts/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / Typer declare parameters through default-value calls by design.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header",
  "typer.Argument", "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
